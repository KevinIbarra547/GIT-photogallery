<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serene Alpine Lake Vista</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .description {
            line-height: 1.6;
            color: #555;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #0066cc;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .detail-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        #ai-title, #ai-description {
            color: #333;
        }
        #ai-description {
            line-height: 1.6;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="ai-title">Loading...</h1>
        <img src="https://www.travelandleisure.com/thmb/QbkeC6xy9WjttZmm3Qtriq-d1tU=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/TAL-Big-Sur-CAPLACES0323-564987dcbc364b658364e51cc250947a.jpg" alt="Image" class="detail-image">
        <p id="ai-description">Generating description...</p>
        <a href="index.html" class="back-link">← Back to Gallery</a>
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const img = document.querySelector('.detail-image');
        const titleEl = document.getElementById('ai-title');
        const descEl = document.getElementById('ai-description');
        
        try {
          const response = await fetch('https://api.groq.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${window.GROQ_API_KEY}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              model: "llama-3.1-70b-versatile",
              messages: [{
                role: "user",
                content: `Describe this image in 2-3 sentences and give it a short title. Image URL: ${img.src}`
              }],
              temperature: 0.7,
              max_tokens: 200,
            }),
          });
          const data = await response.json();
          const content = data.choices[0].message.content;
          
          // Parse the response (assuming it returns title and description)
          const lines = content.split('\n').filter(l => l.trim());
          titleEl.textContent = lines[0] || "Untitled";
          descEl.textContent = lines.slice(1).join(' ') || "No description available.";
        } catch (err) {
          titleEl.textContent = "Error";
          descEl.textContent = "Could not load description.";
          console.error(err);
        }
      });
    </script>
</body>
</html>
