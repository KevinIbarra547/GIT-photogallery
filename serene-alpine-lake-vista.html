<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serene Alpine Lake Vista</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .description {
            line-height: 1.6;
            color: #555;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #0066cc;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .detail-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        #ai-title, #ai-description {
            color: #333;
        }
        #ai-description {
            line-height: 1.6;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="ai-title">Loading...</h1>
        <img src="https://www.travelandleisure.com/thmb/QbkeC6xy9WjttZmm3Qtriq-d1tU=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/TAL-Big-Sur-CAPLACES0323-564987dcbc364b658364e51cc250947a.jpg" alt="Image" class="detail-image">
        <p id="ai-description">Generating description...</p>
        <a href="index.html" class="back-link">← Back to Gallery</a>
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const img = document.querySelector('.detail-image');
        const titleEl = document.getElementById('ai-title');
        const descEl = document.getElementById('ai-description');
        
        try {
          const response = await fetch(`/api/describe?imageUrl=${encodeURIComponent(img.src)}`);
          const data = await response.json();
          
          titleEl.textContent = data.title || "Untitled";
          descEl.textContent = data.description || "No description available.";
        } catch (err) {
          titleEl.textContent = "Error";
          descEl.textContent = "Could not load description. Please try again later.";
          console.error('Failed to load description:', err);
        }
      });
    </script>
</body>
</html>
