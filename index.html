<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-title {
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; margin-bottom: 20px;">Photo Gallery</h1>
        <div class="grid">
            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQFHuv3ahjN3YsvXUD6conJtnqO5QlzW3uXuqRUXqFQNK3yqdxaCj-ceClS&s=10" alt="Hotpot" class="card-img">
                <div class="card-title">Hotpot</div>
                <p style="padding: 0 15px 15px; text-align: center; color: #555;">A delicious and comforting Chinese dish made with a simmering pot of soup stock at the table, with various ingredients added to cook.</p>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/400x300?text=Image+2" alt="Image 2" class="card-img">
                <div class="card-title">Card 2</div>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/400x300?text=Image+3" alt="Image 3" class="card-img">
                <div class="card-title">Card 3</div>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/400x300?text=Image+4" alt="Image 4" class="card-img">
                <div class="card-title">Card 4</div>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/400x300?text=Image+5" alt="Image 5" class="card-img">
                <div class="card-title">Card 5</div>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/400x300?text=Image+6" alt="Image 6" class="card-img">
                <div class="card-title">Card 6</div>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/400x300?text=Image+7" alt="Image 7" class="card-img">
                <div class="card-title">Card 7</div>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/400x300?text=Image+8" alt="Image 8" class="card-img">
                <div class="card-title">Card 8</div>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/400x300?text=Image+9" alt="Image 9" class="card-img">
                <div class="card-title">Card 9</div>
            </div>
        </div>
    </div>
</body>
</html>
