<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-title {
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; margin-bottom: 20px;">Photo Gallery</h1>
        <div class="grid">
            <a href="serene-alpine-lake-vista.html" style="text-decoration: none; color: inherit;">
                <div class="card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQFHuv3ahjN3YsvXUD6conJtnqO5QlzW3uXuqRUXqFQNK3yqdxaCj-ceClS&s=10" alt="Serene Alpine Lake Vista" class="card-img">
                    <div class="card-title">Serene Alpine Lake Vista</div>
                </div>
            </a>
            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSKRyzzog1DNrV7hpE6A8AZFb7yoyO3YMixsY9D_DZ9p3AfY2RKp4H9u8CL&s=10" alt="Pizza" class="card-img">
                <div class="card-title">Pizza</div>
            </div>
            <a href="student-writing-at-desk.html" style="text-decoration: none; color: inherit;">
                <div class="card">
                    <img src="https://image.shutterstock.com/image-vector/modern-school-building-bus-flat-260nw-2664881731.jpg" alt="Student Writing at Desk" class="card-img">
                    <div class="card-title">Student Writing at Desk</div>
                </div>
            </a>
            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTmroO_V971lKbLYuLgKCUwSQvl8A4i138ImXXK28po8H5lnl7bj3a7qxMr&s=10" alt="Sushi" class="card-img">
                <div class="card-title">Sushi</div>
            </div>
            <div class="card">
                <img src="https://wp.internationaltraveller.com/wp-content/uploads/2018/04/IT_2018APR18_HelloworldQantas3.jpg?quality=80&w=640" alt="Airplane" class="card-img">
                <div class="card-title">Airplane</div>
            </div>
            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQNaVeaSsH7TXNgJOFSZQoFx6tNLj_uWOwe4yOJRHh9XpHbMveGPPObKNf2&s=10" alt="Mountain" class="card-img">
                <div class="card-title">Mountain</div>
            </div>
            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTKZRFHb9GpLGigNU-KHEO_j28bWCXvo4Usuq710fU7FHSv8yC_mWYRZg8&s=10" alt="Beach" class="card-img">
                <div class="card-title">Beach</div>
            </div>
            <div class="card">
                <img src="https://californiahighsierra.com/wp-content/uploads/2024/04/birdsonMonoLake_AdobeStock_344739971.jpeg" alt="Birds at Mono Lake" class="card-img">
                <div class="card-title">Birds at Mono Lake</div>
            </div>
            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSXfpUPUWZHXnBxgxEt0NXRV3iqwTh1JjuudDRZpE34dzW6bSg-zbhm9p4&s=10" alt="Forest" class="card-img">
                <div class="card-title">Forest</div>
            </div>
        </div>
    </div>
</body>
</html>
