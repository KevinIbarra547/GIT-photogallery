<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Car Gallery</h1>
        
        <!-- Row 1: Plain Cars -->
        <div class="row-title">Plain Cars</div>
        <div class="grid">
            <a href="toyota-camry.html" style="text-decoration: none; color: inherit;">
                <div class="card">
                    <img src="assets/cars/toyota-camry.jpg" alt="Toyota Camry" class="card-img">
                    <div class="card-title">Toyota Camry</div>
                </div>
            </a>
            <a href="honda-civic.html" style="text-decoration: none; color: inherit;">
                <div class="card">
                    <img src="assets/cars/honda-civic.jpg" alt="Honda Civic" class="card-img">
                    <div class="card-title">Honda Civic</div>
                </div>
            </a>
            <a href="ford-mustang.html" style="text-decoration: none; color: inherit;">
                <div class="card">
                    <img src="assets/cars/ford-mustang.jpg" alt="Ford Mustang" class="card-img">
                    <div class="card-title">Ford Mustang</div>
                </div>
            </a>
        </div>
        
        <!-- Row 2: Luxury Cars -->
        <div class="row-title">Luxury Cars</div>
        <div class="grid">
            <a href="bugatti-chiron.html" style="text-decoration: none; color: inherit;">
                <div class="card">
                    <img src="assets/cars/bugatti-chiron.jpg" alt="Bugatti Chiron" class="card-img">
                    <div class="card-title">Bugatti Chiron</div>
                </div>
            </a>
            <a href="lamborghini-aventador.html" style="text-decoration: none; color: inherit;">
                <div class="card">
                    <img src="assets/cars/lamborghini-aventador.jpg" alt="Lamborghini Aventador" class="card-img">
                    <div class="card-title">Lamborghini Aventador</div>
                </div>
            </a>
            <a href="ferrari-sf90.html" style="text-decoration: none; color: inherit;">
                <div class="card">
                    <img src="assets/cars/ferrari-sf90.jpg" alt="Ferrari SF90 Stradale" class="card-img">
                    <div class="card-title">Ferrari SF90 Stradale</div>
                </div>
            </a>
        </div>
        
        <!-- Row 3: Vintage Cars -->
        <div class="row-title">Vintage Cars</div>
        <div class="grid">
            <a href="ford-model-t.html" style="text-decoration: none; color: inherit;">
                <div class="card">
                    <img src="assets/cars/ford-model-t.jpg" alt="Ford Model T" class="card-img">
                    <div class="card-title">Ford Model T</div>
                </div>
            </a>
            <a href="chevrolet-bel-air.html" style="text-decoration: none; color: inherit;">
                <div class="card">
                    <img src="assets/cars/chevrolet-bel-air.jpg" alt="Chevrolet Bel Air" class="card-img">
                    <div class="card-title">Chevrolet Bel Air</div>
                </div>
            </a>
            <a href="volkswagen-beetle.html" style="text-decoration: none; color: inherit;">
                <div class="card">
                    <img src="assets/cars/volkswagen-beetle.jpg" alt="Volkswagen Beetle" class="card-img">
                    <div class="card-title">Volkswagen Beetle</div>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
