<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferrari SF90 Stradale</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .description {
            line-height: 1.6;
            color: #555;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #0066cc;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .detail-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="ai-title">Loading...</h1>
        <img src="https://cdn.motor1.com/images/mgl/29q8V/s3/ferrari-sf90-stradale.webp" alt="Ferrari SF90 Stradale" class="detail-image">
        <p id="ai-description">Generating description from AI...</p>
        <a href="index.html" class="back-link">\u2190 Back to Gallery</a>
    </div>
    <script>
      const GROQ_API_KEY = 'gsk_YOUR_GROQ_API_KEY_HERE';

      function getImageKeyFromUrl(url) {
        const filename = url.split('/').pop().split('?')[0].toLowerCase();
        if (filename.includes('camry')) return 'toyota-camry';
        if (filename.includes('civic')) return 'honda-civic';
        if (filename.includes('mustang')) return 'ford-mustang';
        if (filename.includes('chiron') || filename.includes('bugatti')) return 'bugatti-chiron';
        if (filename.includes('aventador') || filename.includes('lamborghini')) return 'lamborghini-aventador';
        if (filename.includes('ferrari') || filename.includes('sf90')) return 'ferrari-sf90';
        if (filename.includes('model-t') || filename.includes('ford-model')) return 'ford-model-t';
        if (filename.includes('bel-air') || filename.includes('chevrolet-bel')) return 'chevrolet-bel-air';
        if (filename.includes('beetle') || filename.includes('volkswagen')) return 'volkswagen-beetle';
        return null;
      }

      const fallbackDescriptions = {
        'toyota-camry': {
          title: 'Toyota Camry',
          description: 'The Toyota Camry is a reliable and popular midsize sedan known for its comfortable ride, fuel efficiency, and practical design.'
        },
        'honda-civic': {
          title: 'Honda Civic',
          description: 'The Honda Civic is a compact car renowned for its sporty handling, excellent fuel economy, and modern styling.'
        },
        'ford-mustang': {
          title: 'Ford Mustang',
          description: 'The Ford Mustang is an iconic American muscle car with powerful performance, bold styling, and a legendary driving experience.'
        },
        'bugatti-chiron': {
          title: 'Bugatti Chiron',
          description: 'The Bugatti Chiron is a hypercar representing the pinnacle of automotive engineering, with a quad-turbo W16 engine producing over 1,500 horsepower.'
        },
        'lamborghini-aventador': {
          title: 'Lamborghini Aventador',
          description: 'The Lamborghini Aventador is a flagship supercar with a roaring V12 engine, sharp angular design, and scissor doors that define exotic automotive luxury.'
        },
        'ferrari-sf90': {
          title: 'Ferrari SF90 Stradale',
          description: 'The Ferrari SF90 Stradale is a plug-in hybrid supercar combining a twin-turbo V8 with electric motors for breathtaking acceleration and cutting-edge technology.'
        },
        'ford-model-t': {
          title: 'Ford Model T',
          description: 'The Ford Model T was the first affordable automobile, revolutionizing transportation in the early 20th century with its simple, durable design.'
        },
        'chevrolet-bel-air': {
          title: 'Chevrolet Bel Air',
          description: 'The Chevrolet Bel Air is a classic American car from the 1950s, known for its chrome accents, tail fins, and timeless retro styling.'
        },
        'volkswagen-beetle': {
          title: 'Volkswagen Beetle',
          description: 'The Volkswagen Beetle is an iconic compact car with a distinctive rounded shape, rear-engine layout, and a cultural legacy spanning decades.'
        }
      };

      async function loadDescription() {
        const img = document.querySelector('.detail-image');
        const titleEl = document.getElementById('ai-title');
        const descEl = document.getElementById('ai-description');
        
        try {
          const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${GROQ_API_KEY}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              model: "llama-3.2-11b-vision-preview",
              messages: [{
                role: "user",
                content: [
                  {
                    type: "image_url",
                    image_url: { url: img.src }
                  },
                  {
                    type: "text",
                    text: "Create a short, creative title (3-5 words) and a vivid description (2-3 sentences) for this image. Return ONLY a valid JSON object with exactly this format: {\"title\": \"your title here\", \"description\": \"your description here\"}. Do not include any other text, markdown, or code blocks."
                  }
                ]
              }],
              temperature: 0.8,
              max_tokens: 150,
            }),
          });

          const data = await response.json();
          
          if (data.choices && data.choices[0]) {
            const content = data.choices[0].message.content;
            const jsonMatch = content.match(/\{[\s\S]*\}/);
            if (jsonMatch) {
              try {
                const parsed = JSON.parse(jsonMatch[0]);
                if (parsed.title && parsed.description) {
                  titleEl.textContent = parsed.title;
                  descEl.textContent = parsed.description;
                  return;
                }
              } catch (e) {
                console.log("JSON parse error:", e);
              }
            }
            const lines = content.split('\n').filter(l => l.trim());
            titleEl.textContent = lines[0] || "Untitled Image";
            descEl.textContent = lines.slice(1).join(' ') || "A beautiful image from the gallery.";
            return;
          }
          
          const imageKey = getImageKeyFromUrl(img.src);
          const fallback = imageKey ? fallbackDescriptions[imageKey] : null;
          if (fallback) {
            titleEl.textContent = fallback.title;
            descEl.textContent = fallback.description;
          } else {
            titleEl.textContent = "Ferrari SF90 Stradale";
            descEl.textContent = "The Ferrari SF90 Stradale is a plug-in hybrid supercar combining a twin-turbo V8 with electric motors for breathtaking acceleration and cutting-edge technology.";
          }
        } catch (err) {
          console.error('API Error:', err);
          const imageKey = getImageKeyFromUrl(img.src);
          const fallback = imageKey ? fallbackDescriptions[imageKey] : null;
          
          if (fallback) {
            titleEl.textContent = fallback.title;
            descEl.textContent = fallback.description;
          } else {
            titleEl.textContent = "Ferrari SF90 Stradale";
            descEl.textContent = "The Ferrari SF90 Stradale is a plug-in hybrid supercar combining a twin-turbo V8 with electric motors for breathtaking acceleration and cutting-edge technology.";
          }
        }
      }
      
      document.addEventListener('DOMContentLoaded', loadDescription);
    </script>
</body>
</html>
