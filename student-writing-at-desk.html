<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Writing at Desk</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .description {
            line-height: 1.6;
            color: #555;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #0066cc;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .detail-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="ai-title">Loading...</h1>
        <img src="https://cdn.langeek.co/photo/49183/original/homework?type=jpeg" alt="Image" class="detail-image">
        <p id="ai-description">Generating description from AI...</p>
        <a href="index.html" class="back-link">\u2190 Back to Gallery</a>
    </div>
    <script>
      const GROQ_API_KEY = 'gsk_YOUR_GROQ_API_KEY_HERE';

      function getImageKeyFromUrl(url) {
        const filename = url.split('/').pop().split('?')[0].toLowerCase();
        if (filename.includes('serene') || filename.includes('alpine') || filename.includes('lake') || filename.includes('vista') || filename.includes('big-sur')) {
          return 'serene-alpine-lake-vista';
        }
        if (filename.includes('student') || filename.includes('writing') || filename.includes('desk') || filename.includes('homework')) {
          return 'student-writing-at-desk';
        }
        return null;
      }

      const fallbackDescriptions = {
        'serene-alpine-lake-vista': {
          title: 'Serene Alpine Lake Vista',
          description: 'A breathtaking view of a crystal-clear alpine lake surrounded by majestic snow-capped mountains. The mirror-like water reflects the towering peaks and the vibrant blue sky above.'
        },
        'student-writing-at-desk': {
          title: 'Student Writing at Desk',
          description: 'A focused student sitting at a wooden desk, diligently writing in a notebook. The scene captures the essence of learning and concentration in a quiet study environment.'
        }
      };

      async function loadDescription() {
        const img = document.querySelector('.detail-image');
        const titleEl = document.getElementById('ai-title');
        const descEl = document.getElementById('ai-description');
        
        try {
          const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${GROQ_API_KEY}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              model: "llama-3.2-11b-vision-preview",
              messages: [{
                role: "user",
                content: [
                  {
                    type: "image_url",
                    image_url: { url: img.src }
                  },
                  {
                    type: "text",
                    text: "Create a short, creative title (3-5 words) and a vivid description (2-3 sentences) for this image. Return ONLY a valid JSON object with exactly this format: {\"title\": \"your title here\", \"description\": \"your description here\"}. Do not include any other text, markdown, or code blocks."
                  }
                ]
              }],
              temperature: 0.8,
              max_tokens: 150,
            }),
          });

          const data = await response.json();
          
          if (data.choices && data.choices[0]) {
            const content = data.choices[0].message.content;
            const jsonMatch = content.match(/\{[\s\S]*\}/);
            if (jsonMatch) {
              try {
                const parsed = JSON.parse(jsonMatch[0]);
                if (parsed.title && parsed.description) {
                  titleEl.textContent = parsed.title;
                  descEl.textContent = parsed.description;
                  return;
                }
              } catch (e) {
                console.log("JSON parse error:", e);
              }
            }
            const lines = content.split('\n').filter(l => l.trim());
            titleEl.textContent = lines[0] || "Untitled Image";
            descEl.textContent = lines.slice(1).join(' ') || "A beautiful image from the gallery.";
            return;
          }
          
          // Fallback to static description
          const imageKey = getImageKeyFromUrl(img.src);
          const fallback = imageKey ? fallbackDescriptions[imageKey] : null;
          if (fallback) {
            titleEl.textContent = fallback.title;
            descEl.textContent = fallback.description;
          } else {
            titleEl.textContent = "Student Writing at Desk";
            descEl.textContent = "A focused student sitting at a wooden desk, diligently writing in a notebook. The scene captures the essence of learning and concentration in a quiet study environment.";
          }
        } catch (err) {
          console.error('API Error:', err);
          const imageKey = getImageKeyFromUrl(img.src);
          const fallback = imageKey ? fallbackDescriptions[imageKey] : null;
          
          if (fallback) {
            titleEl.textContent = fallback.title;
            descEl.textContent = fallback.description;
          } else {
            titleEl.textContent = "Student Writing at Desk";
            descEl.textContent = "A focused student sitting at a wooden desk, diligently writing in a notebook. The scene captures the essence of learning and concentration in a quiet study environment.";
          }
        }
      }
      
      document.addEventListener('DOMContentLoaded', loadDescription);
    </script>
</body>
</html>
